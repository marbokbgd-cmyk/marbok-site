name: Deploy Marbok website

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare current product catalog
        run: node scripts/build-catalog.mjs
      - name: Create PDF catalog
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME_BIN" --headless --no-sandbox --disable-gpu --run-all-compositor-stages-before-draw --virtual-time-budget=60000 --no-pdf-header-footer --print-to-pdf=Marbok-katalog.pdf "file://${{ github.workspace }}/katalog-print.html"
          test -s Marbok-katalog.pdf
      - name: Remove build-only catalog files
        run: rm -f catalog-data.json katalog-print.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
